[package]
name = "rust-os"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "rust_os"
path = "./src/main.rs"
test = false
bench = false

[dependencies]
bootloader = "0.9.35"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
spin = "0.12.3"
volatile = "0.2.7"

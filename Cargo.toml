[package]
name = "rust-os"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust_os"
path = "./src/main.rs"
test = true
bench = false

[dependencies]
bootloader = "0.9.35"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
spin = "0.12.3"
volatile = "0.2.7"
x86_64 = "0.15.5"
uart_16550 = "0.8.0"

[package.metadata.bootimage]
test-args = [
  "-device",
  "isa-debug-exit,iobase=0xf4,iosize=0x04",
  "-serial",
  "stdio",
]
test-success-exit-code = 33
